name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.15-bookworm
        env:
          POSTGRES_USER: drivegram
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: drivegram_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drivegram -d drivegram_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://drivegram:test-only@localhost:5432/drivegram_test
      DATABASE_URL: postgresql+psycopg://drivegram:test-only@localhost:5432/drivegram_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.lock
      - run: pip install -e '.[test]'
      - run: ruff check .
      - run: alembic upgrade head
      - run: alembic check
      - run: pytest -q
      - run: node --test apps-script/Code.test.cjs
      - run: docker build -t drivegram:test .
