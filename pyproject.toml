[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "drivegram"
version = "1.0.0"
description = "Private Google Drive to Telegram transfer service"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "SQLAlchemy==2.1.3",
  "psycopg[binary]==3.3.6", "alembic==1.20.0", "httpx==0.28.1",
  "pydantic-settings==2.15.0", "cryptography==50.0.2",
  "argon2-cffi==25.1.0", "python-multipart==0.0.32",
  "jinja2==3.1.6", "itsdangerous==2.2.0"
]

[project.optional-dependencies]
test = ["pytest==9.1.1", "ruff==0.11.5"]

[tool.setuptools.packages.find]
include = ["drivegram*"]

[tool.setuptools.package-data]
drivegram = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
